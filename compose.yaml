services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - 5173:5173
    # Auth/API and other values are read from .env / .env.local, just like the
    # host `bun run dev`. Vite gives inline `environment` values priority over
    # .env files, so we deliberately do not override env vars here (and do not
    # mask .env.local with an empty docker/.env).
    volumes:
      - .:/workspace:cached
      - node_modules:/workspace/node_modules

  magnito:
    image: frourio/magnito:latest
    ports:
      - 5050:5050 # Cognito API
      - 5051:5051 # web interface
    environment:
      COGNITO_USER_POOL_ID: ap-northeast-1_example
      COGNITO_USER_POOL_CLIENT_ID: example-client-name
      COGNITO_ACCESS_KEY: magnito-access-key
      COGNITO_SECRET_KEY: magnito-secret-key
      COGNITO_REGION: ap-northeast-1
      SMTP_HOST: inbucket
      SMTP_PORT: 2500
      SMTP_USER: fake_mail_user
      SMTP_PASS: fake_mail_password
    volumes:
      - magnito:/usr/src/app/data

  inbucket:
    image: inbucket/inbucket:3.0.3
    ports:
      - 2500:2500 # SMTP
      - 9000:9000 # web interface
    volumes:
      - inbucket:/storage

volumes:
  node_modules:
  magnito:
    driver: local
  inbucket:
    driver: local